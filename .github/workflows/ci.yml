name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check headwaters tests scripts bench
      - run: uv run ruff format --check headwaters tests scripts bench
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest tests/test_litellm_guard.py --no-cov -q
      - run: uv run python -m headwaters.core.rules_io --check catalog/rules.schema.json
      - run: uv run python -m headwaters.core.catalog.loader --check catalog/catalog.schema.json
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml -rs
      - name: Symlink tests must run on Linux, not skip
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(uv run pytest tests/test_workspace_pack.py tests/test_workspace_roots.py --no-cov -q -rs)
          echo "$out"
          if echo "$out" | grep -qi skipped; then echo 'symlink tests were skipped'; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml

  newest-python:
    name: ubuntu-latest / py3.14 (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check headwaters tests scripts bench
      - run: uv run mypy
      - run: uv run pytest --no-cov -q

  # Builds the extension VSIX so a broken manifest or an unpackable tree fails here, not at
  # publish time. Deliberately no publish step: `vsce publish` needs a Marketplace PAT and
  # `ovsx publish` needs an Eclipse token, and neither exists in this repository. See
  # docs/reports/HDW-507.md (FU-507-2).
  vscode-extension:
    name: vscode-extension / package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: headwaters-vscode-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error
